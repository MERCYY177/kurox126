name: C13.2 图片自动归集（增量写回）

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c132-localize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      C132_WORKERS: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 自动归集图片（第一轮）
        run: python scripts/localize_images.py
      - name: 自动归集图片（第二轮重试）
        run: python scripts/localize_images.py
      - name: 写回仓库
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/images C13.2_图片归集审计.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "C13.2: incremental image localization [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
